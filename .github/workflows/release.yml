name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      git_commit: ${{ steps.version.outputs.git_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git_commit=$(git rev-parse --short HEAD)
          release_date=$(date -u +%Y%m%d)
          next_tag="${release_date}-${git_commit}"

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "build_time=$build_time" >> "$GITHUB_OUTPUT"
          echo "git_commit=$git_commit" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists on origin."
          else
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag "$TAG"
            fi
            git push origin "$TAG"
          fi

  build:
    name: Build ${{ matrix.asset_base }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_base: gogoclaw_linux_amd64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_base: gogoclaw_darwin_amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64
            asset_base: gogoclaw_darwin_arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.prepare.outputs.tag }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          GIT_COMMIT: ${{ needs.prepare.outputs.git_commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          output_name="${{ matrix.asset_base }}_${VERSION}"
          go build \
            -ldflags "-X github.com/Neneka448/gogoclaw/internal/version.Version=${VERSION} -X github.com/Neneka448/gogoclaw/internal/version.BuildTime=${BUILD_TIME} -X github.com/Neneka448/gogoclaw/internal/version.GitCommit=${GIT_COMMIT}" \
            -o "dist/${output_name}" \
            .
          echo "output_name=${output_name}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.output_name }}
          path: dist/${{ env.output_name }}
          if-no-files-found: error

  release:
    name: Publish Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -maxdepth 2 -exec cp {} release/ \;
          (cd release && sha256sum * > checksums.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          body: |
            Native binaries are published for Linux and macOS.

            Assets:
            - `gogoclaw_linux_amd64_${{ needs.prepare.outputs.tag }}` for Linux x86_64
            - `gogoclaw_darwin_amd64_${{ needs.prepare.outputs.tag }}` for Intel Mac
            - `gogoclaw_darwin_arm64_${{ needs.prepare.outputs.tag }}` for Apple Silicon Mac

            Apple Silicon users should download the `darwin_arm64` asset.

            For full vectorstore and memory support, install the matching sqlite-vec extension for your platform after downloading the binary.
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}